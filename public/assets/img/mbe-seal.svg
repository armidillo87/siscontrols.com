<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Minority Business Enterprise Seal">
  <defs>
    <linearGradient id="mbe-emerald-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mbe-steel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="100,6 182,53 182,147 100,194 18,147 18,53"
           fill="url(#mbe-steel-bg)" stroke="url(#mbe-emerald-bezel)" stroke-width="4" stroke-linejoin="round" />
  
  <polygon points="100,14 174,57 174,143 100,186 26,143 26,57"
           fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Corner Fastener Nodes -->
  <circle cx="100" cy="14" r="3" fill="#10B981" />
  <circle cx="174" cy="57" r="3" fill="#10B981" />
  <circle cx="174" cy="143" r="3" fill="#10B981" />
  <circle cx="100" cy="186" r="3" fill="#10B981" />
  <circle cx="26" cy="143" r="3" fill="#10B981" />
  <circle cx="26" cy="57" r="3" fill="#10B981" />

  <!-- Top Authority Title -->
  <text x="100" y="42" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" fill="#34D399" letter-spacing="1.5" text-anchor="middle">
    MINORITY-OWNED
  </text>
  <text x="100" y="53" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#94A3B8" letter-spacing="1" text-anchor="middle">
    BUSINESS ENTERPRISE
  </text>

  <!-- Central Emphasized "MBE" Insignia -->
  <rect x="42" y="64" width="116" height="42" rx="4" fill="#0B1120" stroke="url(#mbe-emerald-bezel)" stroke-width="2" />
  <text x="100" y="96" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#F8FAFC" letter-spacing="4" text-anchor="middle">
    MBE
  </text>

  <!-- Certified Banner Ribbon -->
  <rect x="48" y="112" width="104" height="18" rx="3" fill="url(#mbe-emerald-bezel)" />
  <text x="100" y="125" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#020617" letter-spacing="1.5" text-anchor="middle">
    SMALL BUSINESS
  </text>

  <!-- Grounded Tracking & Location -->
  <text x="100" y="148" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#E2E8F0" letter-spacing="1" text-anchor="middle">
    BOISE, IDAHO OPERATIONS
  </text>
  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="600" fill="#64748B" letter-spacing="1" text-anchor="middle">
    SUPPLY CHAIN & SOURCING
  </text>
  <text x="100" y="171" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="600" fill="#64748B" letter-spacing="0.5" text-anchor="middle">
    INTERMOUNTAIN WEST
  </text>
</svg>
