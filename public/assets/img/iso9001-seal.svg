<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Factory Acceptance Tested 100% FAT Verified Quality Medallion">
  <defs>
    <!-- Metallic Steel & Electric Cyan Gradients -->
    <linearGradient id="iso-rim-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="iso-inner-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="iso-cyan-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#164E63" />
    </linearGradient>

    <linearGradient id="iso-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Circular Text Paths (r=136) -->
    <path id="iso-text-arc-top" d="M 72,200 A 136,136 0 0,1 328,200" fill="none" stroke="none" />
    <path id="iso-text-arc-bottom" d="M 328,200 A 136,136 0 0,1 72,200" fill="none" stroke="none" />
  </defs>

  <!-- 1. Outer Machined Steel Bezel -->
  <circle cx="200" cy="200" r="194" fill="url(#iso-rim-steel)" stroke="#0F172A" stroke-width="3" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#iso-inner-bevel)" stroke-width="2" />

  <!-- 2. Ten Precision Allen Machine Bolts (Every 36°) -->
  <g transform="translate(200, 18)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(307, 53)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(373, 144)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(373, 256)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(307, 347)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(200, 382)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(93, 347)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(27, 256)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(27, 144)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(93, 53)"><circle cx="0" cy="0" r="9" fill="url(#iso-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>

  <!-- 3. Inner Dark Slate Track (r=164) -->
  <circle cx="200" cy="200" r="164" fill="#0B1120" stroke="#1E293B" stroke-width="2" />
  <circle cx="200" cy="200" r="158" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />

  <!-- 4. Upper Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#F8FAFC" letter-spacing="2.5">
    <textPath href="#iso-text-arc-top" startOffset="50%" text-anchor="middle">
      FACTORY ACCEPTANCE TESTED
    </textPath>
  </text>

  <!-- Side Stars -->
  <text x="56" y="204" font-size="12" fill="#06B6D4" text-anchor="middle">★</text>
  <text x="344" y="204" font-size="12" fill="#06B6D4" text-anchor="middle">★</text>

  <!-- Lower Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#CBD5E1" letter-spacing="2">
    <textPath href="#iso-text-arc-bottom" startOffset="50%" text-anchor="middle">
      POINT-TO-POINT CONTINUITY &amp; MEGGER
    </textPath>
  </text>

  <!-- 5. Inner Cyan Titanium Ring (r=112) -->
  <circle cx="200" cy="200" r="112" fill="url(#iso-cyan-titanium)" stroke="#164E63" stroke-width="2" />
  <circle cx="200" cy="200" r="102" fill="#020617" stroke="url(#iso-cyan-titanium)" stroke-width="3" />

  <!-- Precision Caliper / Dial Vernier Ticks inside r=102 -->
  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="200" y1="102" x2="200" y2="110" />
    <line x1="269" y1="131" x2="264" y2="136" />
    <line x1="298" y1="200" x2="290" y2="200" />
    <line x1="269" y1="269" x2="264" y2="264" />
    <line x1="200" y1="298" x2="200" y2="290" />
    <line x1="131" y1="269" x2="136" y2="264" />
    <line x1="102" y1="200" x2="110" y2="200" />
    <line x1="131" y1="131" x2="136" y2="136" />
  </g>

  <!-- 6. Central "100% FAT" Wordmark -->
  <text x="200" y="178" font-family="system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">
    100% FAT
  </text>
  <text x="200" y="196" font-family="system-ui, -apple-system, sans-serif"
        font-size="9" font-weight="800" fill="#06B6D4" letter-spacing="3" text-anchor="middle">
    VERIFIED PROTOCOL
  </text>

  <!-- 7. Lower Solid Banner: SERIALIZED TRAVELER SIGN-OFF -->
  <rect x="90" y="215" width="220" height="26" rx="4"
        fill="url(#iso-cyan-titanium)" stroke="#164E63" stroke-width="1.5" />
  <text x="200" y="233" font-family="system-ui, -apple-system, sans-serif"
        font-size="11" font-weight="900" fill="#020617" letter-spacing="1.5" text-anchor="middle">
    SERIALIZED TRAVELER SIGN-OFF
  </text>
</svg>