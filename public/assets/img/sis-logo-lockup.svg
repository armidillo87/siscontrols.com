<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-label="Sawtooth Industrial Systems">
  <defs>
    <linearGradient id="sis-lockup-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g id="root">
    <!-- Scaled Mark Group (Origin: 10, 10; Size: 100x100) -->
    <g transform="translate(10, 10) scale(0.1953)">
      <!-- Enclosure Outer Chamfered Polygon -->
      <polygon points="40,104 104,40 408,40 472,104 472,408 408,472 104,472 40,408"
               fill="#0F172A" stroke="#334155" stroke-width="10" />
      <polygon points="56,116 116,56 396,56 456,116 456,396 396,456 116,456 56,396"
               fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 4" />

      <!-- Corner Bolts -->
      <circle cx="94" cy="94" r="12" fill="#64748B" stroke="#0F172A" stroke-width="3" />
      <circle cx="418" cy="94" r="12" fill="#64748B" stroke="#0F172A" stroke-width="3" />
      <circle cx="418" cy="418" r="12" fill="#64748B" stroke="#0F172A" stroke-width="3" />
      <circle cx="94" cy="418" r="12" fill="#64748B" stroke="#0F172A" stroke-width="3" />

      <!-- Mountain Peaks -->
      <polygon points="144,184 76,356 144,356" fill="#94A3B8" />
      <polygon points="144,184 144,356 184,240" fill="#334155" />
      <polygon points="368,164 312,228 324,356 368,356" fill="#64748B" />
      <polygon points="368,164 368,356 436,356" fill="#1E293B" />
      <polygon points="256,112 184,240 212,356 256,356" fill="#CBD5E1" />
      <polygon points="256,112 256,356 324,356 312,228" fill="#1E293B" />
      <line x1="256" y1="112" x2="256" y2="356" stroke="#FFFFFF" stroke-width="3" />

      <!-- Sawtooth Waveform -->
      <path d="M 52,356 L 110,304 L 110,356 L 180,264 L 180,356 L 256,196 L 256,356 L 330,264 L 330,356 L 402,304 L 402,356 L 460,356"
            fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4" />
      <circle cx="256" cy="196" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4" />
    </g>

    <!-- Typography Logotype Group -->
    <g transform="translate(130, 26)">
      <!-- Primary Brand Wordmark: SAWTOOTH -->
      <text x="0" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="36" font-weight="900" fill="#F8FAFC" letter-spacing="3.5">
        SAWTOOTH
      </text>

      <!-- Electrical Accent Line Divider -->
      <line x1="0" y1="44" x2="490" y2="44" stroke="#334155" stroke-width="2" />
      <circle cx="260" cy="44" r="3" fill="#F59E0B" />

      <!-- Subtitle: INDUSTRIAL SYSTEMS -->
      <text x="0" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="16" font-weight="800" fill="#F59E0B" letter-spacing="5">
        INDUSTRIAL SYSTEMS
      </text>

      <!-- Certification Authority Tagline -->
      <text x="0" y="84" font-family="'JetBrains Mono', ui-monospace, monospace"
            font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
        UL 508A PANEL BUILDER • FUNCTIONAL SAFETY • MBE CERTIFIED
      </text>
    </g>
  </g>
</svg>
