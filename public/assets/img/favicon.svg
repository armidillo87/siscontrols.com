<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sawtooth Industrial Systems Favicon">
  <defs>
    <linearGradient id="fav-plate-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Enclosure Base Chassis -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="url(#fav-plate-steel)" stroke="#475569" stroke-width="1.5" />
  <rect x="2.5" y="2.5" width="27" height="27" rx="3.5" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Chiseled Mountain Peaks -->
  <polygon points="16,6 7,22 16,22" fill="#E2E8F0" />
  <polygon points="16,6 16,22 25,22" fill="#334155" />
  <line x1="16" y1="6" x2="16" y2="22" stroke="#FFFFFF" stroke-width="0.75" />

  <!-- Base Ground Bar -->
  <rect x="5" y="22" width="22" height="2" fill="#0B1120" />

  <!-- Amber Electrical Sawtooth Waveform -->
  <path d="M 3,22 L 9,17 L 9,22 L 16,11 L 16,22 L 23,17 L 23,22 L 29,22"
        fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4" />
  <path d="M 3,22 L 9,17 L 9,22 L 16,11 L 16,22 L 23,17 L 23,22 L 29,22"
        fill="none" stroke="#FFFBEB" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4" />

  <!-- High-Voltage Apex Node -->
  <circle cx="16" cy="11" r="1.5" fill="#FFFBEB" stroke="#D97706" stroke-width="0.75" />
</svg>