<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Minority Business Enterprise Supplier Diversity Credential Medallion">
  <defs>
    <!-- Metallic Steel & Emerald Titanium Gradients -->
    <linearGradient id="mbe-rim-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="mbe-inner-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="mbe-emerald-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="mbe-star-facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <linearGradient id="mbe-star-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="mbe-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Circular Text Paths (r=136) -->
    <path id="mbe-text-arc-top" d="M 72,200 A 136,136 0 0,1 328,200" fill="none" stroke="none" />
    <path id="mbe-text-arc-bottom" d="M 328,200 A 136,136 0 0,1 72,200" fill="none" stroke="none" />
  </defs>

  <!-- 1. Outer Machined Steel Bezel -->
  <circle cx="200" cy="200" r="194" fill="url(#mbe-rim-steel)" stroke="#0F172A" stroke-width="3" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#mbe-inner-bevel)" stroke-width="2" />

  <!-- 2. Ten Precision Allen Machine Bolts (Every 36°) -->
  <g transform="translate(200, 18)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(307, 53)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(373, 144)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(373, 256)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(307, 347)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(200, 382)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(93, 347)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(27, 256)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(27, 144)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <g transform="translate(93, 53)"><circle cx="0" cy="0" r="9" fill="url(#mbe-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>

  <!-- 3. Inner Dark Slate Track (r=164) -->
  <circle cx="200" cy="200" r="164" fill="#0B1120" stroke="#1E293B" stroke-width="2" />
  <circle cx="200" cy="200" r="158" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />

  <!-- 4. Upper Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#F8FAFC" letter-spacing="2.5">
    <textPath href="#mbe-text-arc-top" startOffset="50%" text-anchor="middle">
      MINORITY-OWNED ENTERPRISE
    </textPath>
  </text>

  <!-- Side Stars -->
  <text x="56" y="204" font-size="12" fill="#10B981" text-anchor="middle">★</text>
  <text x="344" y="204" font-size="12" fill="#10B981" text-anchor="middle">★</text>

  <!-- Lower Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="2">
    <textPath href="#mbe-text-arc-bottom" startOffset="50%" text-anchor="middle">
      FAR 19.7 TIER 2 DIVERSITY CREDIT
    </textPath>
  </text>

  <!-- 5. Inner Emerald Titanium Ring (r=112) -->
  <circle cx="200" cy="200" r="112" fill="url(#mbe-emerald-titanium)" stroke="#064E3B" stroke-width="2" />
  <circle cx="200" cy="200" r="102" fill="#020617" stroke="url(#mbe-emerald-titanium)" stroke-width="3" />

  <!-- 6. Faceted 5-Pointed Star Crest -->
  <g transform="translate(200, 138) scale(0.65)">
    <!-- Star Points (Faceted Light/Dark) -->
    <!-- Top Point -->
    <polygon points="0,0 0,-30 8.8,-9.5" fill="url(#mbe-star-facet-dark)" />
    <polygon points="0,0 -8.8,-9.5 0,-30" fill="url(#mbe-star-facet-light)" />
    <!-- Top-Right Point -->
    <polygon points="0,0 28.5,-9.5 14.7,4.8" fill="url(#mbe-star-facet-dark)" />
    <polygon points="0,0 8.8,-9.5 28.5,-9.5" fill="url(#mbe-star-facet-light)" />
    <!-- Bottom-Right Point -->
    <polygon points="0,0 17.6,24.3 0,11.5" fill="url(#mbe-star-facet-dark)" />
    <polygon points="0,0 14.7,4.8 17.6,24.3" fill="url(#mbe-star-facet-light)" />
    <!-- Bottom-Left Point -->
    <polygon points="0,0 -17.6,24.3 -14.7,4.8" fill="url(#mbe-star-facet-dark)" />
    <polygon points="0,0 0,11.5 -17.6,24.3" fill="url(#mbe-star-facet-light)" />
    <!-- Top-Left Point -->
    <polygon points="0,0 -28.5,-9.5 -8.8,-9.5" fill="url(#mbe-star-facet-dark)" />
    <polygon points="0,0 -14.7,4.8 -28.5,-9.5" fill="url(#mbe-star-facet-light)" />
  </g>

  <!-- Laurel Leaf Spray Accents -->
  <path d="M 135,178 Q 140,158 152,148" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M 265,178 Q 260,158 248,148" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />

  <!-- 7. Central "MBE" Wordmark -->
  <text x="200" y="196" font-family="system-ui, -apple-system, sans-serif"
        font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">
    MBE
  </text>

  <!-- 8. Lower Solid Banner: SUPPLIER DIVERSITY PARTNER -->
  <rect x="90" y="215" width="220" height="26" rx="4"
        fill="url(#mbe-emerald-titanium)" stroke="#064E3B" stroke-width="1.5" />
  <text x="200" y="233" font-family="system-ui, -apple-system, sans-serif"
        font-size="11.5" font-weight="900" fill="#020617" letter-spacing="1.5" text-anchor="middle">
    SUPPLIER DIVERSITY PARTNER
  </text>
</svg>