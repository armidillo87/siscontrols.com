<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Quality Control and FAT Protocol Seal">
  <defs>
    <linearGradient id="iso-steel-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="iso-cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <radialGradient id="iso-dark-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Outer Cogwheel / Gear Contour (Quality Engineering Symbol) -->
  <circle cx="100" cy="100" r="95" fill="url(#iso-steel-ring)" stroke="#334155" stroke-width="2" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Gear Teeth Notches Around Perimeter (16 notches) -->
  <g fill="#CBD5E1">
    <rect x="98" y="2" width="4" height="6" rx="1" />
    <rect x="98" y="192" width="4" height="6" rx="1" />
    <rect x="2" y="98" width="6" height="4" rx="1" />
    <rect x="192" y="98" width="6" height="4" rx="1" />
    <rect x="30" y="30" width="4" height="6" rx="1" transform="rotate(-45 32 33)" />
    <rect x="166" y="30" width="4" height="6" rx="1" transform="rotate(45 168 33)" />
    <rect x="30" y="166" width="4" height="6" rx="1" transform="rotate(45 32 169)" />
    <rect x="166" y="166" width="4" height="6" rx="1" transform="rotate(-45 168 169)" />
  </g>

  <!-- Inner Dark Core -->
  <circle cx="100" cy="100" r="80" fill="url(#iso-dark-core)" stroke="url(#iso-cyan-accent)" stroke-width="2.5" />

  <!-- Upper Arc Text -->
  <path id="iso-top-arc" d="M 32,100 A 68,68 0 0,1 168,100" fill="none" stroke="none" />
  <text font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" fill="#E2E8F0" letter-spacing="1.5">
    <textPath href="#iso-top-arc" startOffset="50%" text-anchor="middle">
      FACTORY ACCEPTANCE TESTED
    </textPath>
  </text>

  <!-- Central Emblem -->
  <rect x="26" y="70" width="148" height="36" rx="4" fill="#0B1120" stroke="url(#iso-cyan-accent)" stroke-width="1.5" />
  <text x="100" y="95" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#F8FAFC" letter-spacing="1.5" text-anchor="middle">
    100% FAT VERIFIED
  </text>

  <!-- Lower Banner -->
  <rect x="46" y="114" width="108" height="18" rx="3" fill="url(#iso-cyan-accent)" />
  <text x="100" y="127" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" fill="#020617" letter-spacing="1.5" text-anchor="middle">
    POINT-TO-POINT TESTED
  </text>

  <!-- Lower Technical Subtitle -->
  <text x="100" y="150" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#94A3B8" letter-spacing="1" text-anchor="middle">
    CONTINUITY • DIELECTRIC • MEGGER
  </text>
  <text x="100" y="162" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="600" fill="#64748B" letter-spacing="1" text-anchor="middle">
    TRAVELER SIGN-OFF PROTOCOL
  </text>
</svg>
