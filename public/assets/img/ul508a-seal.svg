<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Built to UL 508A Standards Compliance Medallion">
  <defs>
    <!-- Metallic Steel & Gold Gradients -->
    <linearGradient id="ul-rim-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="ul-inner-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="ul-gold-medallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="ul-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Circular Text Paths (r=136) -->
    <!-- Top Arc (Clockwise from 215° to 325°) -->
    <path id="ul-text-arc-top" d="M 72,200 A 136,136 0 0,1 328,200" fill="none" stroke="none" />
    <!-- Bottom Arc (Clockwise along lower semi-circle) -->
    <path id="ul-text-arc-bottom" d="M 328,200 A 136,136 0 0,1 72,200" fill="none" stroke="none" />
  </defs>

  <!-- 1. Outer Machined Steel Bezel -->
  <circle cx="200" cy="200" r="194" fill="url(#ul-rim-steel)" stroke="#0F172A" stroke-width="3" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="url(#ul-inner-bevel)" stroke-width="2" />

  <!-- 2. Ten Precision Allen Machine Bolts (Every 36°) -->
  <!-- 0° (Top) -->
  <g transform="translate(200, 18)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 36° -->
  <g transform="translate(307, 53)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 72° -->
  <g transform="translate(373, 144)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 108° -->
  <g transform="translate(373, 256)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 144° -->
  <g transform="translate(307, 347)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 180° (Bottom) -->
  <g transform="translate(200, 382)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 216° -->
  <g transform="translate(93, 347)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 252° -->
  <g transform="translate(27, 256)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 288° -->
  <g transform="translate(27, 144)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>
  <!-- 324° -->
  <g transform="translate(93, 53)"><circle cx="0" cy="0" r="9" fill="url(#ul-bolt-grad)" stroke="#0B1120" stroke-width="1.5"/><circle cx="0" cy="0" r="5" fill="#0B1120"/><polygon points="0,-4 3.5,-2 3.5,2 0,4 -3.5,2 -3.5,-2" fill="#020617"/></g>

  <!-- 3. Inner Dark Slate Track (r=164) -->
  <circle cx="200" cy="200" r="164" fill="#0B1120" stroke="#1E293B" stroke-width="2" />
  <circle cx="200" cy="200" r="158" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />

  <!-- 4. Upper Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#F8FAFC" letter-spacing="2.5">
    <textPath href="#ul-text-arc-top" startOffset="50%" text-anchor="middle">
      INDUSTRIAL CONTROL PANELS
    </textPath>
  </text>

  <!-- Side Stars -->
  <text x="56" y="204" font-size="12" fill="#F59E0B" text-anchor="middle">★</text>
  <text x="344" y="204" font-size="12" fill="#F59E0B" text-anchor="middle">★</text>

  <!-- Lower Inscription -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#CBD5E1" letter-spacing="2.5">
    <textPath href="#ul-text-arc-bottom" startOffset="50%" text-anchor="middle">
      STANDARDS COMPLIANCE
    </textPath>
  </text>

  <!-- 5. Inner Anodized Gold 16-Tooth Gear / Cogwheel Plate (r=112) -->
  <circle cx="200" cy="200" r="112" fill="url(#ul-gold-medallion)" stroke="#78350F" stroke-width="2" />
  <circle cx="200" cy="200" r="102" fill="#020617" stroke="url(#ul-gold-medallion)" stroke-width="3" />

  <!-- 6. Central Brand Plaque -->
  <!-- Circuit Traces Pattern in Background -->
  <g stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 130,170 L 155,170 L 170,185 L 170,215 L 180,225" />
    <circle cx="130" cy="170" r="2.5" fill="#F59E0B" />
    <path d="M 270,170 L 245,170 L 230,185 L 230,215 L 220,225" />
    <circle cx="270" cy="170" r="2.5" fill="#F59E0B" />
  </g>

  <!-- Central "UL 508A" Wordmark -->
  <text x="200" y="180" font-family="system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">
    UL 508A
  </text>
  <text x="200" y="196" font-family="system-ui, -apple-system, sans-serif"
        font-size="8.5" font-weight="800" fill="#F59E0B" letter-spacing="2.5" text-anchor="middle">
    PANEL SAFETY STANDARDS
  </text>

  <!-- 7. Lower Solid Banner: NFPA 70 | NFPA 79 -->
  <rect x="110" y="215" width="180" height="26" rx="4"
        fill="url(#ul-gold-medallion)" stroke="#78350F" stroke-width="1.5" />
  <text x="200" y="233" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="900" fill="#020617" letter-spacing="2" text-anchor="middle">
    NFPA 70  |  NFPA 79
  </text>
</svg>