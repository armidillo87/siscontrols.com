<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 100" width="550" height="100" role="img" aria-label="Sawtooth Industrial Systems">
  <defs>
    <!-- Metallic Steel Gradients -->
    <linearGradient id="lockup-frame-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="lockup-frame-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="lockup-gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Mountain Lighting Gradients -->
    <linearGradient id="lockup-peak-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="lockup-peak-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="lockup-amber-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="lockup-bolt-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <g id="root">
    <!-- =================================================================== -->
    <!-- 1. SCALED PURE VECTOR MARK (Origin: 8, 8; Size: 84x84)              -->
    <!-- =================================================================== -->
    <g transform="translate(8, 8) scale(0.164)">
      <!-- Solid Backplane -->
      <polygon points="256,36 432,108 432,420 392,460 120,460 80,420 80,108"
               fill="#0B1120" stroke="#020617" stroke-width="2" />

      <!-- Machine Steel Gantry Frame -->
      <polygon points="256,36 432,108 432,420 392,460 120,460 80,420 80,108"
               fill="none" stroke="url(#lockup-frame-steel)" stroke-width="28" stroke-linejoin="round" />

      <!-- Outer Bevel Ridge Line -->
      <polygon points="256,22 446,100 446,428 402,472 110,472 66,428 66,100"
               fill="none" stroke="url(#lockup-frame-highlight)" stroke-width="3" stroke-linejoin="round" />

      <!-- Inner Gold Anodized Lip -->
      <polygon points="256,56 414,120 414,408 378,444 134,444 98,408 98,120"
               fill="none" stroke="url(#lockup-gold-bevel)" stroke-width="2.5" stroke-opacity="0.85" stroke-linejoin="round" />

      <!-- Corner Bolts -->
      <g transform="translate(256, 70)">
        <circle cx="0" cy="0" r="14" fill="url(#lockup-bolt-bezel)" stroke="#020617" stroke-width="2" />
        <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
        <circle cx="0" cy="0" r="2" fill="#F59E0B" />
      </g>
      <g transform="translate(120, 136)">
        <circle cx="0" cy="0" r="14" fill="url(#lockup-bolt-bezel)" stroke="#020617" stroke-width="2" />
        <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
        <circle cx="0" cy="0" r="2" fill="#F59E0B" />
      </g>
      <g transform="translate(392, 136)">
        <circle cx="0" cy="0" r="14" fill="url(#lockup-bolt-bezel)" stroke="#020617" stroke-width="2" />
        <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
        <circle cx="0" cy="0" r="2" fill="#F59E0B" />
      </g>
      <g transform="translate(120, 420)">
        <circle cx="0" cy="0" r="14" fill="url(#lockup-bolt-bezel)" stroke="#020617" stroke-width="2" />
        <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
        <circle cx="0" cy="0" r="2" fill="#F59E0B" />
      </g>
      <g transform="translate(392, 420)">
        <circle cx="0" cy="0" r="14" fill="url(#lockup-bolt-bezel)" stroke="#020617" stroke-width="2" />
        <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
        <circle cx="0" cy="0" r="2" fill="#F59E0B" />
      </g>

      <!-- Mountain Peaks -->
      <polygon points="148,210 98,340 148,340" fill="url(#lockup-peak-light)" />
      <polygon points="148,210 148,340 185,255" fill="url(#lockup-peak-shadow)" />
      <polygon points="364,205 320,260 332,340 364,340" fill="url(#lockup-peak-light)" />
      <polygon points="364,205 364,340 414,340" fill="url(#lockup-peak-shadow)" />
      <polygon points="198,160 148,265 170,340 198,340" fill="url(#lockup-peak-light)" />
      <polygon points="198,160 198,340 235,230" fill="url(#lockup-peak-shadow)" />
      <polygon points="314,155 275,235 288,340 314,340" fill="url(#lockup-peak-light)" />
      <polygon points="314,155 314,340 355,340 340,250" fill="url(#lockup-peak-shadow)" />
      <polygon points="256,96 198,230 218,340 256,340" fill="url(#lockup-peak-light)" />
      <polygon points="256,96 256,340 314,340 295,225" fill="url(#lockup-peak-shadow)" />
      <line x1="256" y1="96" x2="256" y2="340" stroke="#FFFFFF" stroke-width="2.5" />

      <!-- Ground Busbar -->
      <rect x="96" y="338" width="320" height="12" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1.5" />

      <!-- Electric Sawtooth Waveform -->
      <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
            fill="none" stroke="#020617" stroke-width="18" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />
      <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
            fill="none" stroke="url(#lockup-amber-pulse)" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />
      <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
            fill="none" stroke="#FFFBEB" stroke-width="2.2" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />
    </g>

    <!-- =================================================================== -->
    <!-- 2. TYPOGRAPHIC WORDMARK & SUBTITLE                                   -->
    <!-- =================================================================== -->
    <g transform="translate(104, 0)">
      <!-- Primary Wordmark: SAWTOOTH -->
      <text x="0" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="4">
        SAWTOOTH
      </text>

      <!-- Micro-Milled Circuit Divider Line -->
      <line x1="0" y1="65" x2="435" y2="65" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="65" x2="70" y2="65" stroke="#F59E0B" stroke-width="2" />
      <circle cx="70" cy="65" r="2.5" fill="#F59E0B" />

      <!-- Subtitle: INDUSTRIAL SYSTEMS -->
      <text x="0" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="16" font-weight="800" fill="#F59E0B" letter-spacing="6.5">
        INDUSTRIAL SYSTEMS
      </text>
    </g>
  </g>
</svg>