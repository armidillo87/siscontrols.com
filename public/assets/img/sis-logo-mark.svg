<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sawtooth Industrial Systems Brand Mark">
  <defs>
    <!-- Metallic Steel Gradients -->
    <linearGradient id="mark-frame-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="mark-frame-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="mark-gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Mountain Lighting Gradients -->
    <linearGradient id="peak-light-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="peak-shadow-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="peak-light-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="peak-shadow-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="peak-light-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="peak-shadow-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Pulse Gradient -->
    <linearGradient id="mark-amber-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Fastener Gradient -->
    <linearGradient id="mark-bolt-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. SOLID INDUSTRIAL BACKPLANE (Dark Steel Interior)                    -->
  <!-- ===================================================================== -->
  <polygon points="256,36 432,108 432,420 392,460 120,460 80,420 80,108"
           fill="#0B1120" stroke="#020617" stroke-width="2" />

  <!-- ===================================================================== -->
  <!-- 2. STRUCTURAL STEEL CANOPY & ENCLOSURE FRAME                          -->
  <!-- ===================================================================== -->
  <!-- Outer Machine Steel Gantry Frame -->
  <polygon points="256,36 432,108 432,420 392,460 120,460 80,420 80,108"
           fill="none" stroke="url(#mark-frame-steel)" stroke-width="28" stroke-linejoin="round" />

  <!-- Outer Bevel Ridge Line -->
  <polygon points="256,22 446,100 446,428 402,472 110,472 66,428 66,100"
           fill="none" stroke="url(#mark-frame-highlight)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Gold Anodized Framing Lip -->
  <polygon points="256,56 414,120 414,408 378,444 134,444 98,408 98,120"
           fill="none" stroke="url(#mark-gold-bevel)" stroke-width="2.5" stroke-opacity="0.85" stroke-linejoin="round" />

  <!-- ===================================================================== -->
  <!-- 3. FIVE PRECISION CORNER ALLEN-HEAD MACHINE BOLTS                     -->
  <!-- ===================================================================== -->
  <!-- Apex Bolt (256, 70) -->
  <g transform="translate(256, 70)">
    <circle cx="0" cy="0" r="14" fill="url(#mark-bolt-bezel)" stroke="#020617" stroke-width="2" />
    <circle cx="0" cy="0" r="8.5" fill="#0B1120" />
    <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
    <circle cx="0" cy="0" r="2" fill="#F59E0B" />
  </g>
  <!-- Top-Left Shoulder Bolt (120, 136) -->
  <g transform="translate(120, 136)">
    <circle cx="0" cy="0" r="14" fill="url(#mark-bolt-bezel)" stroke="#020617" stroke-width="2" />
    <circle cx="0" cy="0" r="8.5" fill="#0B1120" />
    <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
    <circle cx="0" cy="0" r="2" fill="#F59E0B" />
  </g>
  <!-- Top-Right Shoulder Bolt (392, 136) -->
  <g transform="translate(392, 136)">
    <circle cx="0" cy="0" r="14" fill="url(#mark-bolt-bezel)" stroke="#020617" stroke-width="2" />
    <circle cx="0" cy="0" r="8.5" fill="#0B1120" />
    <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
    <circle cx="0" cy="0" r="2" fill="#F59E0B" />
  </g>
  <!-- Bottom-Left Base Bolt (120, 420) -->
  <g transform="translate(120, 420)">
    <circle cx="0" cy="0" r="14" fill="url(#mark-bolt-bezel)" stroke="#020617" stroke-width="2" />
    <circle cx="0" cy="0" r="8.5" fill="#0B1120" />
    <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
    <circle cx="0" cy="0" r="2" fill="#F59E0B" />
  </g>
  <!-- Bottom-Right Base Bolt (392, 420) -->
  <g transform="translate(392, 420)">
    <circle cx="0" cy="0" r="14" fill="url(#mark-bolt-bezel)" stroke="#020617" stroke-width="2" />
    <circle cx="0" cy="0" r="8.5" fill="#0B1120" />
    <polygon points="0,-6.5 5.6,-3.2 5.6,3.2 0,6.5 -5.6,3.2 -5.6,-3.2" fill="#020617" />
    <circle cx="0" cy="0" r="2" fill="#F59E0B" />
  </g>

  <!-- ===================================================================== -->
  <!-- 4. CHISELED SAWTOOTH MOUNTAIN PEAKS                                   -->
  <!-- ===================================================================== -->
  <!-- Left Flanking Peak (Apex: 148, 210) -->
  <polygon points="148,210 98,340 148,340" fill="url(#peak-light-left)" />
  <polygon points="148,210 148,340 185,255" fill="url(#peak-shadow-left)" />
  <line x1="148" y1="210" x2="148" y2="340" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Right Flanking Peak (Apex: 364, 205) -->
  <polygon points="364,205 320,260 332,340 364,340" fill="url(#peak-light-right)" />
  <polygon points="364,205 364,340 414,340" fill="url(#peak-shadow-right)" />
  <line x1="364" y1="205" x2="364" y2="340" stroke="#94A3B8" stroke-width="1.5" />

  <!-- Left Intermediate Peak (Apex: 198, 160) -->
  <polygon points="198,160 148,265 170,340 198,340" fill="url(#peak-light-left)" />
  <polygon points="198,160 198,340 235,230" fill="url(#peak-shadow-left)" />
  <line x1="198" y1="160" x2="198" y2="340" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Right Intermediate Peak (Apex: 314, 155) -->
  <polygon points="314,155 275,235 288,340 314,340" fill="url(#peak-light-center)" />
  <polygon points="314,155 314,340 355,340 340,250" fill="url(#peak-shadow-center)" />
  <line x1="314" y1="155" x2="314" y2="340" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Grand Center Peak (Apex: 256, 96) -->
  <polygon points="256,96 198,230 218,340 256,340" fill="url(#peak-light-center)" />
  <polygon points="256,96 256,340 314,340 295,225" fill="url(#peak-shadow-center)" />
  <!-- Crisp Center Ridge Line -->
  <line x1="256" y1="96" x2="256" y2="340" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Heavy Ground Busbar Base Plate -->
  <rect x="96" y="338" width="320" height="12" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <g fill="#0B1120">
    <rect x="125" y="341" width="18" height="6" rx="1.5" />
    <rect x="185" y="341" width="18" height="6" rx="1.5" />
    <rect x="247" y="341" width="18" height="6" rx="1.5" />
    <rect x="309" y="341" width="18" height="6" rx="1.5" />
    <rect x="369" y="341" width="18" height="6" rx="1.5" />
  </g>

  <!-- ===================================================================== -->
  <!-- 5. AGGRESSIVE ELECTRIC SAWTOOTH WAVEFORM                             -->
  <!-- ===================================================================== -->
  <!-- Layer 1: Dark Drop Contour (creates maximum separation) -->
  <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
        fill="none" stroke="#020617" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />

  <!-- Layer 2: Safety Amber Energy Core -->
  <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
        fill="none" stroke="url(#mark-amber-pulse)" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />

  <!-- Layer 3: White-Hot Arc Core -->
  <path d="M 48,312 L 105,312 L 132,255 L 158,365 L 198,205 L 228,395 L 256,152 L 284,408 L 314,215 L 354,365 L 380,255 L 407,312 L 464,312"
        fill="none" stroke="#FFFBEB" stroke-width="2.2" stroke-linejoin="miter" stroke-miterlimit="4" stroke-linecap="round" />

  <!-- High-Voltage Contact Nodes -->
  <circle cx="48" cy="312" r="6" fill="#F59E0B" stroke="#020617" stroke-width="2" />
  <circle cx="198" cy="205" r="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <circle cx="256" cy="152" r="7.5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="314" cy="215" r="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <circle cx="464" cy="312" r="6" fill="#F59E0B" stroke="#020617" stroke-width="2" />
</svg>