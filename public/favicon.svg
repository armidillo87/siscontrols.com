<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sawtooth Industrial Systems Favicon">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Heavy Enclosure Chassis -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="url(#fav-bg)" stroke="#475569" stroke-width="1.5" />
  <rect x="2.5" y="2.5" width="27" height="27" rx="3.5" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Chiseled Mountain Peaks -->
  <polygon points="16,7 6,23 16,23" fill="#E2E8F0" />
  <polygon points="16,7 16,23 26,23" fill="#334155" />
  <line x1="16" y1="7" x2="16" y2="23" stroke="#FFFFFF" stroke-width="0.75" />

  <!-- Base Ground Bar -->
  <rect x="5" y="23" width="22" height="2" fill="#0F172A" />

  <!-- Amber Electrical Sawtooth Waveform -->
  <path d="M 4,23 L 9.5,18.5 L 9.5,23 L 16,12 L 16,23 L 22.5,18.5 L 22.5,23 L 28,23"
        fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linejoin="miter" stroke-linecap="round" />
  <path d="M 4,23 L 9.5,18.5 L 9.5,23 L 16,12 L 16,23 L 22.5,18.5 L 22.5,23 L 28,23"
        fill="none" stroke="#FFFBEB" stroke-width="0.8" stroke-linejoin="miter" stroke-linecap="round" />

  <!-- High-Voltage Apex Node -->
  <circle cx="16" cy="12" r="1.5" fill="#FFFBEB" stroke="#D97706" stroke-width="0.75" />
</svg>
