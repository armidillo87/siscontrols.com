<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Minority-Owned Business Enterprise Supplier Diversity Credential Plate">
  <defs>
    <!-- Industrial Metallic & Emerald Titanium Gradients -->
    <linearGradient id="mbe-chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="mbe-border-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="mbe-emerald-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="mbe-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- 1. Heavy Chamfered Equipment Chassis Plate -->
  <polygon points="20,8 180,8 192,20 192,180 180,192 20,192 8,180 8,20"
           fill="url(#mbe-chassis-grad)" stroke="url(#mbe-border-steel)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Recessed Milled Gasket Line -->
  <polygon points="24,14 176,14 186,24 186,176 176,186 24,186 14,176 14,24"
           fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.35" />

  <!-- 2. Four Precision Machine Bolts (Chamfered Hex) -->
  <!-- Top-Left -->
  <g transform="translate(22, 22)">
    <circle cx="0" cy="0" r="6" fill="url(#mbe-bolt-grad)" stroke="#020617" stroke-width="1" />
    <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#020617" />
    <circle cx="0" cy="0" r="1" fill="#10B981" />
  </g>
  <!-- Top-Right -->
  <g transform="translate(178, 22)">
    <circle cx="0" cy="0" r="6" fill="url(#mbe-bolt-grad)" stroke="#020617" stroke-width="1" />
    <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#020617" />
    <circle cx="0" cy="0" r="1" fill="#10B981" />
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(178, 178)">
    <circle cx="0" cy="0" r="6" fill="url(#mbe-bolt-grad)" stroke="#020617" stroke-width="1" />
    <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#020617" />
    <circle cx="0" cy="0" r="1" fill="#10B981" />
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(22, 178)">
    <circle cx="0" cy="0" r="6" fill="url(#mbe-bolt-grad)" stroke="#020617" stroke-width="1" />
    <polygon points="0,-3.5 3,-1.7 3,1.7 0,3.5 -3,1.7 -3,-1.7" fill="#020617" />
    <circle cx="0" cy="0" r="1" fill="#10B981" />
  </g>

  <!-- 3. Top Spec Header -->
  <text x="100" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="8" font-weight="800" fill="#34D399" letter-spacing="2.5" text-anchor="middle">
    SUPPLIER DIVERSITY
  </text>
  <line x1="38" y1="38" x2="162" y2="38" stroke="#334155" stroke-width="1" />

  <!-- 4. Central Emblem: Laser-Engraved Emerald Titanium Box -->
  <rect x="28" y="46" width="144" height="62" rx="4"
        fill="#020617" stroke="url(#mbe-emerald-badge)" stroke-width="2" />

  <!-- Emerald Micro-Stripe Header inside box -->
  <path d="M 28,58 L 172,58" stroke="#047857" stroke-width="1" />
  <text x="100" y="55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="6.5" font-weight="700" fill="#A7F3D0" letter-spacing="2" text-anchor="middle">
    MINORITY-OWNED ENTERPRISE
  </text>

  <!-- Big Bold MBE -->
  <text x="100" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="900" fill="#F8FAFC" letter-spacing="4" text-anchor="middle">
    MBE
  </text>

  <text x="100" y="101" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="7" font-weight="700" fill="#6EE7B7" letter-spacing="1.5" text-anchor="middle">
    DIVERSITY PARTNER
  </text>

  <!-- 5. Technical Specification Rows -->
  <g transform="translate(100, 122)">
    <!-- Sub-badge: Small Business Qualified -->
    <rect x="-65" y="0" width="130" height="17" rx="3"
          fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="0" y="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="8" font-weight="800" fill="#F8FAFC" letter-spacing="1.2" text-anchor="middle">
      SMALL BUSINESS QUALIFIED
    </text>
  </g>

  <!-- Micro Separator with Emerald Node -->
  <line x1="42" y1="149" x2="158" y2="149" stroke="#334155" stroke-width="1" />
  <circle cx="100" cy="149" r="2" fill="#10B981" />

  <!-- Location & Operations Line -->
  <text x="100" y="161" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="7.5" font-weight="700" fill="#CBD5E1" letter-spacing="1" text-anchor="middle">
    BOISE, IDAHO OPERATIONS
  </text>

  <!-- FAR 19.7 Tier 2 Credit Line -->
  <text x="100" y="173" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="7" font-weight="600" fill="#94A3B8" letter-spacing="1.2" text-anchor="middle">
    FAR 19.7 TIER 2 DIVERSITY CREDIT
  </text>
</svg>
